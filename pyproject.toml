[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-tail-risk-engine"
version = "0.3.1"
description = "Rigorous, public-OSINT-only, bi-temporal quantification of reporting-lag distortion for West African littoral fairways."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Maritime domain researcher with 20+ years of operational experience" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==1.10.26",
    "numpy==2.4.2",
    "scipy==1.17.0",
    "hypothesis==6.151.9",
    "pytest==9.0.2",
]

[project.scripts]
maritime-risk = "maritime_risk.cli:main"

[project.urls]
Homepage = "https://github.com/mrbestnaija/maritime-tail-risk-engine"
ORCID = "https://orcid.org/0009-0008-0112-9273"

[project.entry-points."maritime_risk.plugins"]

[tool.setuptools.packages.find]
where = ["."]
include = ["maritime_risk*"]

[tool.setuptools.package-data]
maritime_risk = ["py.typed", "configs/*.json"]
